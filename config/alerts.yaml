# Real-time Telegram alerts (no LLM) — polled by scheduler during market hours
enabled: true

# Price quote poll interval (Finnhub /quote per symbol each cycle)
poll_interval_minutes: 10

# Run news ingest every N quote polls → 10 × 3 = 30 minutes
news_ingest_every_n_polls: 3

# Skip alert-side ingest if any ingest ran within this window (avoids doubling up
# with scheduled briefs at 7:00 / 16:45 which already call ingest)
skip_ingest_if_ran_within_minutes: 30

market_hours:
  enabled: true
  timezone: America/New_York
  weekdays: [0, 1, 2, 3, 4, 5, 6]  # every day (alerts are not limited to US trading days)
  start: "07:00"
  end: "20:00"

news:
  sec_forms:
    - 8-K
    - 10-K
    - 10-Q
  material_keywords:
    - earnings
    - acquisition
    - merger
    - guidance
    - lawsuit
    - sec investigation
    - downgrade
    - upgrade
    - beat
    - miss
  classified_types:
    - earnings
    - m_and_a
    - legal

price:
  default_move_pct: 5.0
  rules:
    - symbol: NVDA
      move_pct: 3.0
    - symbol: SPY
      move_pct: 2.0
    - symbol: QQQ
      move_pct: 2.5
    - symbol: VIX
      move_pct: 8.0
      direction: up
