# CIO Investment Agent — US equities only
# Hierarchical pipeline: Regime → Theme → Industry → Stock → Portfolio → Scenario → Triggers → Monitor
enabled: true
version: 2

default_risk_level: L2

# Report output
report:
  languages: [zh, en]

# ── Layer 1: Regime driver labels ──
regime_drivers:
  - growth
  - inflation
  - liquidity
  - credit
  - policy

# ── Layer 2: Investment themes ──
themes:
  ai_infrastructure:
    name: AI Infrastructure
    name_zh: AI 基础设施
    keywords: [ai, gpu, capex, hyperscaler, datacenter, nvidia, semiconductor]
    narrative_topics: [ai, earnings]
    momentum_etfs: [SMH, XLK, QQQ]
    horizon: 6-12 months
    catalyst_default: Hyperscaler capex / AI server demand
    risk_default: Capex slowdown / valuation reset

  defense_modernization:
    name: Defense Modernization
    name_zh: 国防现代化
    keywords: [defense, missile, radar, satellite, pentagon, nato]
    narrative_topics: [geopolitics]
    momentum_etfs: [ITA, XLI]
    horizon: 12-24 months
    catalyst_default: Defense budget / geopolitical tension
    risk_default: Budget cuts / peace dividend

  power_grid:
    name: Power Grid & Electrification
    name_zh: 电网与电气化
    keywords: [grid, utility, power, electrification, transformer, nuclear]
    narrative_topics: [energy]
    momentum_etfs: [XLU, XLI]
    horizon: 12-24 months
    catalyst_default: AI power demand / grid investment
    risk_default: Regulatory delay / rate caps

  industrial_automation:
    name: Industrial Automation
    name_zh: 工业自动化
    keywords: [automation, robotics, factory, reshoring, capex]
    narrative_topics: [industrial]
    momentum_etfs: [XLI, SMH]
    horizon: 6-12 months
    catalyst_default: Reshoring / productivity capex
    risk_default: Manufacturing slowdown

  cybersecurity:
    name: Cybersecurity
    name_zh: 网络安全
    keywords: [cyber, security, breach, ransomware, zero trust]
    narrative_topics: [tech]
    momentum_etfs: [XLK, XLC]
    horizon: 6-12 months
    catalyst_default: Enterprise security spend
    risk_default: Budget scrutiny in downturn

  healthcare_innovation:
    name: Healthcare Innovation
    name_zh: 医疗创新
    keywords: [biotech, pharma, glp, obesity, fda, clinical]
    narrative_topics: [healthcare]
    momentum_etfs: [XLV]
    horizon: 12-24 months
    catalyst_default: Pipeline / GLP-1 ecosystem
    risk_default: Pricing / regulatory

weak_themes:
  consumer_staples:
    name: Consumer Staples
    name_zh: 必需消费
    etf: XLP
    reason: Defensive rotation lagging in selective risk-on
  consumer_discretionary:
    name: Consumer Discretionary
    name_zh: 可选消费
    etf: XLY
    reason: Rate-sensitive spending; narrow leadership elsewhere
  office_reit:
    name: Office REIT
    name_zh: 办公地产
    etf: XLRE
    reason: Structural office demand headwind
  legacy_telecom:
    name: Legacy Telecom
    name_zh: 传统电信
    etf: XLC
    reason: Capex burden / slow growth

