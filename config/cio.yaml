# ── Layer 5: US-only strategic allocation ──
allocation:
  expansion:
    us_equity: 55
    bonds: 15
    gold: 10
    cash: 10
    international: 0
  recovery:
    us_equity: 55
    bonds: 20
    gold: 10
    cash: 15
    international: 0
  slowdown:
    us_equity: 42
    bonds: 28
    gold: 12
    cash: 18
    international: 0
  recession_risk:
    us_equity: 30
    bonds: 35
    gold: 15
    cash: 20
    international: 0

risk_level_tilt:
  L1: { equity_mult: 0.75 }
  L2: { equity_mult: 1.0 }
  L3: { equity_mult: 1.15 }

# Theme → ETF implementation map
theme_etfs:
  ai_infrastructure: [SMH, QQQ]
  defense_modernization: [ITA]
  power_grid: [XLU, XLI]
  industrial_automation: [XLI]
  cybersecurity: [XLK]
  healthcare_innovation: [XLV]
  consumer_discretionary: [XLY]
  consumer_staples: [XLP]

core_etfs: [SPY, QQQ, SMH, XLI, ITA, XLU, TLT, GLD]

# ── Layer 7: If → Then triggers ──
triggers:
  - id: yield_spike
    if: "10Y yield > 4.8%"
    then: [Reduce duration, Reduce growth beta, Trim QQQ/SMH]
    metric: ten_year_yield
    threshold: 4.8
    op: gt
  - id: breadth_improves
    if: "Breadth improves (RSP outperforms SPY)"
    then: [Increase RSP/IWM, Reduce cash, Add small-cap tilt]
    signal: breadth_improving
  - id: ai_guidance_miss
    if: "AI earnings guidance miss"
    then: [Reduce GPU/memory sleeve, Increase cash, Trim SMH]
    signal: ai_earnings_risk
  - id: vix_stress
    if: "VIX > 28"
    then: [Raise cash 5-8%, Cut cyclicals, Add TLT/GLD]
    metric: vix
    threshold: 28
    op: gt
  - id: cpi_hot
    if: "CPI above expectations"
    then: [Reduce growth, Extend cash buffer, Favor quality]
    signal: inflation_risk

# ── Layer 8: Market health dimensions ──
health_dimensions:
  breadth: { weight: 0.22 }
  credit: { weight: 0.20 }
  liquidity: { weight: 0.18 }
  valuation: { weight: 0.20 }
  momentum: { weight: 0.20 }

# Watch calendar keywords (matched against sentiment / earnings)
watch_keywords:
  - { event: CPI, importance: high, keywords: [cpi, inflation] }
  - { event: Retail Sales, importance: medium, keywords: [retail sales] }
  - { event: Fed communication, importance: high, keywords: [fed, powell, fomc] }
  - { event: NVDA Earnings, importance: very_high, tickers: [NVDA], keywords: [nvidia, earnings] }
