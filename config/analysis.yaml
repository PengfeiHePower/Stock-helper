# Long-horizon market & strategy analysis (monthly)
enabled: true

default_risk_level: L2   # L1 conservative | L2 balanced | L3 aggressive

monthly_report:
  enabled: true
  hour: 8
  minute: 0
  timezone: America/New_York   # uses BRIEF_TIMEZONE if omitted in code

biweekly_update:
  enabled: true
  hour: 8
  minute: 15
  # First trading day on/after the 1st and 15th of each month

data_refresh:
  fundamentals_max_age_days: 35   # refresh watchlist metrics monthly
  regime_cache_days: 7

scope:
  market_etfs: [SPY, QQQ, IWM, DIA, TLT, GLD]
  sector_etfs: [XLK, XLF, XLE, XLV, XLY, XLP, XLI, XLB, XLU, XLRE, XLC]

regime:
  # Rule-based classifier thresholds (see docs/ANALYSIS.md)
  vix_elevated: 20
  vix_stress: 28
  curve_inverted: 0.0          # 10Y-2Y spread (T10Y2Y)
  unemployment_rising_bps: 0.3 # 3-month UNRATE change

risk_levels:
  L1:
    label: Conservative
    label_zh: 保守
    equity_budget_pct: 40
    max_single_stock_pct: 5
    style: quality,low_beta,dividend
  L2:
    label: Balanced
    label_zh: 均衡
    equity_budget_pct: 65
    max_single_stock_pct: 8
    style: quality,growth_balance
  L3:
    label: Aggressive
    label_zh: 进取
    equity_budget_pct: 85
    max_single_stock_pct: 12
    style: growth,momentum
